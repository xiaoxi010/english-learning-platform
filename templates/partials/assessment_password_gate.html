<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ gate_title }} · 访问验证</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/assessment-common.css') }}">
</head>
<body>
{% include 'partials/app_shell_open.html' %}

<div class="assess-shell assess-gate-page">
    <a href="{{ back_url }}" class="assess-gate-back">← 返回</a>
    <section class="home-section assess-gate-card">
        <h2 class="assess-gate-title">{{ gate_title }}</h2>
        <p class="assess-gate-desc">请输入访问密码后继续</p>
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, msg in messages %}
        <p class="assess-gate-error">{{ msg }}</p>
        {% endfor %}
        {% endif %}
        {% endwith %}
        <form method="post" action="{{ unlock_url }}" class="assess-gate-form">
            <input type="hidden" name="_assessment_gate" value="1">
            <label class="assess-gate-label" for="access_password">访问密码</label>
            <input type="password"
                   id="access_password"
                   name="access_password"
                   class="assess-gate-input"
                   autocomplete="off"
                   required
                   placeholder="请输入密码">
            <button type="submit" class="btn-primary assess-gate-submit">进入测评</button>
        </form>
    </section>
</div>

{% include 'partials/app_shell_close.html' %}
</body>
</html>
